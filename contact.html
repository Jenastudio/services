<script>
const email = document.getElementById('email');
const confirmationEmail = document.getElementById('confirmation_email');

function verifierEmails() {
  confirmationEmail.setCustomValidity(
    confirmationEmail.value && email.value !== confirmationEmail.value
      ? 'Les adresses e-mail ne correspondent pas.'
      : ''
  );
}

email.addEventListener('input', verifierEmails);
confirmationEmail.addEventListener('input', verifierEmails);
</script>
